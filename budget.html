<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>經費明細｜童話王國新聞台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: same tabloid system as the proposal page — a ledger page: total, share bar, then one block per category. Single light theme by design. */
:root {
  color-scheme: light;
  --paper: #fbfaf7; --paper-2: #f1efe9; --ink: #18181a; --ink-2: #55545a; --rule: #18181a; --hair: #d9d6cf; --red: #d7261e;
  --c1: #18181a; --c2: #d7261e; --c3: #2f7fb8; --c4: #d98b1f; --c5: #7a5bb5; --c6: #3a9461;
  --font-head: "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
.page { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-family: var(--font-head); text-wrap: balance; }
a { color: inherit; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
[id] { scroll-margin-top: 56px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
nav.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--ink); color: var(--paper); }
nav.top .page { display: flex; gap: 4px 14px; align-items: center; overflow-x: auto; padding-block: 8px; font-size: 13px; white-space: nowrap; }
nav.top b { font-family: var(--font-head); font-size: 15px; margin-right: 8px; }
nav.top a { text-decoration: none; color: #b9b7b2; padding: 3px 9px; border-radius: 2px; transition: color .2s, background .2s; }
nav.top a:hover { color: #fff; }
nav.top a.on { color: #fff; background: var(--red); font-weight: 700; }
.laser-btn { margin-left: auto; border: 1.5px solid #6b6a70; background: transparent; color: #e6e4df; padding: 3px 12px; border-radius: 999px; font-size: 13px; }
.laser-btn[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }

/* cursor */
.cur-dot, .cur-ring { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 100; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; }
.cur-dot { width: 8px; height: 8px; background: var(--red); }
.cur-ring { width: 34px; height: 34px; border: 1.5px solid var(--ink); transition: width .2s, height .2s, background .2s, border-color .2s; }
.cur-on .cur-dot, .cur-on .cur-ring { opacity: 1; }
.cur-on, .cur-on * { cursor: none !important; }
.cur-hot .cur-ring { width: 50px; height: 50px; background: rgba(215, 38, 30, .12); border-color: var(--red); }
.laser .cur-ring { opacity: 0 !important; }
.laser .cur-dot { width: 16px; height: 16px; background: #ff2b20; box-shadow: 0 0 0 4px rgba(255, 43, 32, .25), 0 0 18px 6px rgba(255, 43, 32, .55); }
.trail { position: fixed; width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 43, 32, .55); pointer-events: none; z-index: 99; transform: translate(-50%, -50%); animation: fade .6s forwards; }
@keyframes fade { to { opacity: 0; transform: translate(-50%, -50%) scale(.3); } }

/* header */
header.head { padding-block: 32px 8px; display: grid; gap: 10px; }
.back { font-size: 14px; font-weight: 700; text-decoration: none; color: var(--ink-2); width: fit-content; }
.back:hover { color: var(--red); }
.head-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.head h1 { font-size: clamp(36px, 6vw, 64px); font-weight: 900; line-height: 1.15; border-bottom: 6px double var(--rule); padding-bottom: 12px; }

/* summary */
.summary { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 24px 48px; align-items: end; padding-block: 28px 8px; }
@media (max-width: 820px) { .summary { grid-template-columns: 1fr; } }
.total { display: grid; gap: 6px; }
.total .lbl { font-size: 13px; color: var(--ink-2); }
.total .n { font-family: var(--font-head); font-weight: 900; font-size: clamp(32px, 4.6vw, 48px); line-height: 1; color: var(--red); font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.facts div { padding: 12px 14px; border-left: 1px solid var(--hair); display: grid; gap: 2px; min-width: 0; }
.facts div:first-child { border-left: none; padding-left: 0; }
.facts dt { font-size: 12.5px; color: var(--ink-2); }
.facts dd { margin: 0; font-family: var(--font-mono); font-weight: 600; font-size: 16px; }
@media (max-width: 520px) { .facts { grid-template-columns: 1fr; } .facts div { border-left: none; padding-left: 0; border-top: 1px solid var(--hair); } .facts div:first-child { border-top: none; } }

/* share bar */
.share { display: grid; gap: 12px; padding-block: 28px 0; }
.stack { display: flex; height: 34px; border: 1.5px solid var(--ink); overflow: hidden; }
.stack span { display: block; height: 100%; transition: flex-grow 1.1s cubic-bezier(.2,.7,.2,1); }
.stack span + span { border-left: 2px solid var(--paper); }
.stack.pre span { flex-grow: 0 !important; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; }
.legend a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.legend a:hover { color: var(--red); }
.legend i { width: 12px; height: 12px; display: inline-block; }
.legend b { font-family: var(--font-mono); font-weight: 500; color: var(--ink-2); }

/* categories */
.cat { padding-block: 44px 0; display: grid; gap: 14px; }
.cat-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; border-top: 3px solid var(--rule); padding-top: 10px; }
.cat-head h2 { font-size: clamp(22px, 3vw, 30px); font-weight: 900; display: flex; align-items: center; gap: 12px; }
.cat-head h2 i { width: 14px; height: 14px; display: inline-block; }
.cat-head .amt { font-family: var(--font-mono); font-weight: 600; font-size: 18px; }
.cat-head .amt small { color: var(--ink-2); font-weight: 400; font-size: 13px; margin-left: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
th { font-size: 12.5px; color: var(--ink-2); border-bottom: 2px solid var(--rule); font-weight: 700; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.item b { font-weight: 700; }
td.item span { display: block; font-size: 13px; color: var(--ink-2); }
td.num small { font-family: var(--font-body); font-size: 12.5px; color: var(--ink-2); }
td.strong { font-weight: 600; }
.cnote { font-size: 13px; color: var(--ink-2); }
@media (max-width: 640px) { table { font-size: 13.5px; } th, td { padding: 9px 6px; } td.item span { font-size: 12px; } }

/* grand total */
.grand { margin-top: 48px; border: 2px solid var(--rule); background: #fff; }
.grand table { font-size: 16px; }
.grand td { padding: 12px 16px; }
.grand tr:last-child td { border-bottom: none; font-weight: 900; font-size: 20px; }
.grand tr:last-child td.num { color: var(--red); }
.notes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 28px; padding-block: 28px 0; font-size: 14px; color: var(--ink-2); }
.notes b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
@media (max-width: 760px) { .notes { grid-template-columns: 1fr; } }

footer { background: var(--ink); color: var(--paper); margin-top: 64px; padding-block: 40px; }
footer .page { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
footer .ft { font-family: var(--font-head); font-weight: 900; font-size: clamp(22px, 3vw, 30px); line-height: 1.4; }
.totop, .home { font-family: var(--font-mono); font-weight: 600; font-size: 16px; letter-spacing: .08em; color: #fff; text-decoration: none; padding-bottom: 8px; border-bottom: 2px solid #6b6a70; }
.totop:hover, .home:hover { border-bottom-color: var(--red); }
.links { display: flex; gap: 24px; flex-wrap: wrap; }
</style>
</head>
<body>

<nav class="top" aria-label="章節">
  <div class="page">
    <b>童話王國新聞台</b>
    <a href="index.html">← 提案首頁</a>
    <span id="catnav"></span>
    <button type="button" id="laser" class="laser-btn" aria-pressed="false" title="快捷鍵 L">簡報筆</button>
  </div>
</nav>

<header class="page head" id="top">
  <div class="head-top"><span>媒體識讀互動體驗展　提案附件</span><span>展期一個月・設備以月租估算</span></div>
  <h1>經費明細</h1>
</header>

<main class="page">
  <section class="summary" aria-label="經費總覽">
    <div class="total">
      <span class="lbl">總經費（含 10% 預備金，不含場地費）</span>
      <span class="n" id="totaln">NT$ 1,257,520</span>
    </div>
    <dl class="facts">
      <div><dt>小計</dt><dd>1,143,200</dd></div>
      <div><dt>預備金 10%</dt><dd>114,320</dd></div>
      <div><dt>項目數</dt><dd id="itemcount">—</dd></div>
    </dl>
  </section>

  <section class="share" aria-label="各類別占比">
    <div class="stack pre" id="stack" role="img" aria-label="各類別經費占小計的比例"></div>
    <div class="legend" id="legend"></div>
  </section>

  <div id="cats"></div>

  <section class="grand" aria-label="經費總計">
    <table>
      <tbody id="grandrows"></tbody>
    </table>
  </section>

  <section class="notes" aria-label="估算說明">
    <p><b>不含場地費</b>本表未列場地費，依實際合作場館另計。</p>
    <p><b>設備以月租估算</b>展期一個月；若展期延長，投影機與電視可評估改為買斷。</p>
    <p><b>系統自行開發</b>查核員證網頁與互動程式由團隊開發，不另列外包費。</p>
  </section>
</main>

<footer>
  <div class="page">
    <p class="ft">每一筆經費，<br>都是為了讓觀眾看見自己的判斷。</p>
    <div class="links"><a class="home" href="index.html">← 提案首頁</a><a class="totop" href="#top">BACK TO TOP ↑</a></div>
  </div>
</footer>

<script>
const CATS = [
  { id: "space", name: "空間與展示製作", color: "var(--c1)", items: [
    ["童話新聞翻板", "雙面印刷，含旋轉五金", 12, "面", 4500],
    ["隔間牆木作", "同溫層房間，高 3 m", 18, "公尺", 2800],
    ["大型投影幕", "深偽劇場，約 8 × 3 m，含框架", 1, "式", 30000],
    ["沙發／長凳租賃", "深偽劇場，座位約 15 人", 5, "組", 4000],
    ["展台與工作桌", "報到、標題工廠、查核實驗室、回顧", 10, "組", 6000],
    ["大圖輸出與指標", "牆面輸出、地貼、動線指標", 1, "式", 80000],
    ["施工與撤場人工", "木作、輸出安裝、拆除", 1, "式", 60000],
  ]},
  { id: "hw", name: "硬體設備", note: "單價為一個月租金", color: "var(--c2)", items: [
    ["65 吋電視含立架", "標題工廠 1、王國回顧 2、出口 1", 4, "台", 15000],
    ["雷射投影機", "深偽劇場大投影，高流明", 1, "台", 40000],
    ["高流明投影機含吊架", "截圖偵探 2、同溫層房間 4", 6, "台", 25000],
    ["平板電腦", "報到 1、標題工廠 3、查核實驗室 6", 10, "台", 3000],
    ["控制電腦", "截圖偵探、同溫層、回顧", 3, "台", 6000],
    ["指向性喇叭", "深偽劇場，避免聲音干擾其他區", 2, "組", 5000],
    ["網路", "行動路由器或專線", 1, "式", 12000],
    ["影音技術人員", "架設、巡檢與故障排除", 1, "式", 60000],
    ["設備備品與維修", "線材、電源、故障更換", 1, "式", 20000],
  ]},
  { id: "sys", name: "系統開發", color: "var(--c3)", items: [
    ["熱感應收據機", "出口，含 1 台備用", 3, "台", 4500],
    ["NFC 讀卡機", "報到與各站感應", 6, "個", 1200],
    ["NFC 實體卡", "長者或無手機觀眾", 600, "張", 15],
    ["雲端資料庫與網域", "查核員證網頁", 1, "式", 3000],
  ]},
  { id: "content", name: "內容製作", color: "var(--c4)", items: [
    ["童話角色插畫與動畫", "新聞牆、截圖偵探、同溫層素材", 1, "式", 80000],
    ["深偽影片製作", "約 5 分鐘輪播影片：演員、拍攝、合成", 1, "式", 40000],
    ["題目與教案審訂", "邀請查核單位或教師諮詢", 1, "式", 15000],
  ]},
  { id: "print", name: "印刷與宣傳", color: "var(--c5)", items: [
    ["查核步驟小卡", "出口發放", 5000, "張", 3],
    ["感熱收據紙", "出口收據機", 30, "捲", 60],
    ["陪伴指南", "教師教案與家長陪伴指南", 500, "份", 30],
    ["海報與 DM", "學校宣傳", 1, "式", 20000],
  ]},
  { id: "ops", name: "營運與評估", color: "var(--c6)", items: [
    ["現場工作人員", "3 人 × 26 天 × 8 小時", 624, "人時", 200],
    ["工作人員餐費", "現場 3 人 × 26 天，另加進撤場", 90, "人次", 150],
    ["公共意外責任險", "1 個月", 1, "式", 15000],
    ["貨運", "進場、撤場各一趟", 2, "趟", 8000],
  ]},
];
const fmt = n => n.toLocaleString("en-US");
const sum = a => a.reduce((x, y) => x + y, 0);
CATS.forEach(c => { c.items.forEach(i => i[5] = i[2] * i[4]); c.total = sum(c.items.map(i => i[5])); });
const SUB = sum(CATS.map(c => c.total)), RES = Math.round(SUB * 0.1), ALL = SUB + RES;
document.getElementById("itemcount").textContent = CATS.reduce((n, c) => n + c.items.length, 0) + " 項";

// nav + legend + stack
document.getElementById("catnav").innerHTML = CATS.map(c => `<a href="#${c.id}">${c.name}</a>`).join("");
document.getElementById("legend").innerHTML = CATS.map(c =>
  `<a href="#${c.id}"><i style="background:${c.color}"></i>${c.name} <b>${(c.total / SUB * 100).toFixed(1)}%</b></a>`).join("");
document.getElementById("stack").innerHTML = CATS.map(c =>
  `<span style="flex-grow:${c.total};background:${c.color}" title="${c.name} ${fmt(c.total)}"></span>`).join("");

// category blocks
document.getElementById("cats").innerHTML = CATS.map(c => `
  <section class="cat pre" id="${c.id}" aria-labelledby="${c.id}-h">
    <div class="cat-head"><h2 id="${c.id}-h"><i style="background:${c.color}"></i>${c.name}</h2><span class="amt">${fmt(c.total)}<small>${(c.total / SUB * 100).toFixed(1)}%</small></span></div>
    ${c.note ? `<p class="cnote">${c.note}</p>` : ""}
    <table>
      <thead><tr><th>項目</th><th class="num">數量</th><th class="num">單價</th><th class="num">小計（元）</th></tr></thead>
      <tbody>${c.items.map(([n, d, q, u, pr, t]) => `
        <tr><td class="item"><b>${n}</b><span>${d}</span></td>
        <td class="num">${fmt(q)} <small>${u}</small></td>
        <td class="num">${fmt(pr)}</td>
        <td class="num strong">${fmt(t)}</td></tr>`).join("")}
      </tbody>
    </table>
  </section>`).join("");

document.getElementById("grandrows").innerHTML =
  CATS.map(c => `<tr><td>${c.name}</td><td class="num">${fmt(c.total)}</td></tr>`).join("") +
  `<tr><td>小計</td><td class="num">${fmt(SUB)}</td></tr><tr><td>預備金 10%</td><td class="num">${fmt(RES)}</td></tr><tr><td>總計</td><td class="num">NT$ ${fmt(ALL)}</td></tr>`;

// animations (repeat on every view)
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const totalEl = document.getElementById("totaln");
let runId = 0;
function countTotal() {
  const id = ++runId, t0 = performance.now(), dur = 1400;
  (function tick(now) {
    if (id !== runId) return;
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    totalEl.textContent = "NT$ " + fmt(Math.round(ALL * e));
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}
const growers = [document.getElementById("stack"), ...document.querySelectorAll(".cat")];
if (!reduce && "IntersectionObserver" in window) {
  totalEl.textContent = "NT$ 0";
  const io = new IntersectionObserver(es => es.forEach(en => {
    const t = en.target;
    if (t === totalEl) { if (en.isIntersecting) countTotal(); else { runId++; totalEl.textContent = "NT$ 0"; } return; }
    t.classList.toggle("pre", !en.isIntersecting);
  }), { threshold: 0.25 });
  io.observe(totalEl); growers.forEach(g => io.observe(g));
} else {
  growers.forEach(g => g.classList.remove("pre"));
}

// nav current section
const navLinks = [...document.querySelectorAll('#catnav a')];
function spy() {
  const y = scrollY + innerHeight * 0.3; let cur = null;
  CATS.forEach(c => { const el = document.getElementById(c.id); if (el.getBoundingClientRect().top + scrollY <= y) cur = c.id; });
  navLinks.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + cur));
}
addEventListener("scroll", spy, { passive: true }); spy();

// cursor + presenter laser
if (matchMedia("(pointer: fine)").matches) {
  const dot = document.createElement("div"), ring = document.createElement("div");
  dot.className = "cur-dot"; ring.className = "cur-ring"; document.body.append(dot, ring);
  const root = document.documentElement;
  let mx = -100, my = -100, rx = -100, ry = -100, laser = false, last = 0;
  addEventListener("mousemove", e => {
    mx = e.clientX; my = e.clientY; root.classList.add("cur-on");
    dot.style.left = mx + "px"; dot.style.top = my + "px";
    root.classList.toggle("cur-hot", !!e.target.closest("a, button"));
    if (laser && !reduce && performance.now() - last > 24) {
      last = performance.now();
      const t = document.createElement("div"); t.className = "trail"; t.style.left = mx + "px"; t.style.top = my + "px";
      document.body.appendChild(t); setTimeout(() => t.remove(), 600);
    }
  });
  document.addEventListener("mouseleave", () => root.classList.remove("cur-on"));
  (function follow() { rx += (mx - rx) * .2; ry += (my - ry) * .2; ring.style.left = rx + "px"; ring.style.top = ry + "px"; requestAnimationFrame(follow); })();
  const btn = document.getElementById("laser");
  const setLaser = on => { laser = on; root.classList.toggle("laser", on); btn.setAttribute("aria-pressed", on); };
  btn.addEventListener("click", () => setLaser(!laser));
  addEventListener("keydown", e => { if ((e.key === "l" || e.key === "L") && !e.metaKey && !e.ctrlKey) setLaser(!laser); });
} else {
  document.getElementById("laser").hidden = true;
}
</script>
</body>
</html>
